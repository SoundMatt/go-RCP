name: Docker publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/go-rcp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    name: Build & push (${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target: [go-rcp, controller, zone]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      # Derives SPEC_VERSION from rcp.SpecVersion itself (via the CLI's own
      # `version --format json` output) rather than hand-copying it, so the
      # io.relay.spec-version OCI label (spec §13.5) can never drift from the
      # RELAY spec version this module actually targets.
      - name: Compute build metadata (spec version, tool version)
        id: buildmeta
        run: |
          go build -o /tmp/go-rcp-buildmeta ./cmd/go-rcp
          spec_version="$(/tmp/go-rcp-buildmeta version --format json | jq -r .spec_version)"
          tool_version="$(git describe --tags --always --dirty)"
          echo "spec_version=${spec_version}" >> "$GITHUB_OUTPUT"
          echo "tool_version=${tool_version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SPEC_VERSION=${{ steps.buildmeta.outputs.spec_version }}
            TOOL_VERSION=${{ steps.buildmeta.outputs.tool_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
