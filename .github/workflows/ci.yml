name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or SHA to test"
        required: false
        default: "main"

jobs:
  # ── Unit tests (cross-platform) ───────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: go vet
        run: go vet ./...

      - name: go test (unit + fuzz seed corpus, -race)
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

  # ── Benchmark smoke ───────────────────────────────────────────────────────
  benchmark-smoke:
    name: Benchmark smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: go test -bench (smoke, 1 iteration each)
        run: >
          go test
          -bench=.
          -benchtime=1x
          -benchmem
          -run=^$
          ./mock/...

  # ── Short fuzz run ────────────────────────────────────────────────────────
  fuzz-short:
    name: Fuzz (short, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Clear fuzz corpus cache
        run: go clean -fuzzcache

      - name: FuzzClient_Request
        run: go test -fuzz=^FuzzClient_Request$ -fuzztime=10s ./mock/...

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ── go-FuSa safety checks (RELAY §20 continuous-conformance lifecycle) ─────
  gofusa:
    name: go-FuSa safety check (v0.47.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install go-FuSa
        run: go install github.com/SoundMatt/go-FuSa/cmd/gofusa@v0.47.1
      - name: gofusa check (0 errors required)
        run: gofusa check ./...
      - name: gofusa vuln (dependency vulnerability scan, §20.1.2)
        run: gofusa vuln
      - name: gofusa qualify (tool qualification suite, §20.1.2)
        run: gofusa qualify
      - name: Verify required safety artifacts are present
        run: |
          missing=0
          for f in \
            .fusa.json \
            .fusa-reqs.json \
            .fusa-hara.json \
            .fusa-problems.json \
            .fusa-iec62443.json \
            SECURITY.md \
            INCIDENT-RESPONSE.md \
            SAFETY_PLAN.md \
            .github/CODEOWNERS; do
            if [ ! -f "$f" ]; then
              echo "::error::Required safety artifact missing: $f"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
      - name: Verify traceability (all requirements traced and tested)
        run: |
          # No `|| true` / `2>/dev/null` here: if gofusa trace itself fails to
          # run, or fails to produce /tmp/trace.json, this step MUST fail the
          # build rather than silently no-op (that gap let the requirement
          # traceability gate report success for months without ever actually
          # checking anything, since it read a `requirements[].traced/.tested`
          # shape the installed gofusa no longer emits).
          gofusa trace --format json -output /tmp/trace.json
          python3 - << 'PYEOF'
          import json

          # No bare `except: pass` — a missing/renamed field here MUST raise
          # and fail the build, not be swallowed as an ambiguous pass.
          d = json.load(open('/tmp/trace.json'))
          cov = d['coverage']
          total = cov['totalRequirements']
          traced = cov['tracedRequirements']
          tested = cov['testedRequirements']
          print(f"requirements: {traced}/{total} traced, {tested}/{total} tested")

          # RELAY §20.1.2 requires 100% traceability: every requirement traced AND tested.
          if traced < total or tested < total:
              print(f"::error::Traceability gate failed: {total - traced} untraced, "
                    f"{total - tested} untested requirement(s) (100% required)")
              raise SystemExit(1)
          PYEOF

  # ── RELAY conformance gate (§20 continuous conformance) ───────────────────
  # Validates the go-rcp CLI's version/capabilities/status documents against
  # the generic §12 JSON Schemas (cli-version/cli-capabilities/cli-status)
  # embedded in the authoritative `relay` binary (--strict fails on WARN as
  # well as FAIL). Pin the relay version to the spec version this module
  # targets (go.mod RELAY) so spec bumps are an explicit upgrade.
  #
  # `relay interop --protocol RCP` is deliberately NOT run here as of
  # ROADMAP.md Milestone 59 (v1.0.0): its embedded RCP golden vector and the
  # rcp-command/rcp-status §15.5 canonical-type schemas `relay conform` does
  # NOT touch are still the retired bespoke Zone/Command/Response/Status
  # shape (see RELAY spec/vectors/rcp-status.json and
  # spec/schemas/rcp-{command,status}.json as of RELAY v1.14.0, the latest
  # correctly-tagged release checked at this milestone) — this module no
  # longer implements or claims interop with that shape, and updating those
  # upstream is out of this repo's scope (RELAY is a separate project).
  #
  # RELAY's own v2.0.0 tag message claims a TC18-shaped rcp-message.json
  # schema/vector replacement that would resolve this, but the v2.0.0 tag
  # object itself does not point at the commit that actually adds those
  # files (confirmed against RELAY's git history — the tag resolves to an
  # unrelated CI-pin commit) — see SoundMatt/RELAY#72, filed upstream to
  # track that tagging bug separately. Bumping this repo's RELAY pin to
  # v2.0.0 today would NOT fix the gap this comment describes. Re-enable
  # this step once a *correctly tagged* RELAY release actually carries the
  # TC18-shaped RCP golden vector; tracked out-of-repo (SoundMatt/RELAY#72),
  # not silently dropped (see ROADMAP.md Milestone 59's own "Done" writeup
  # and Guiding Principle 10). The warning step below keeps this gap visible
  # in every CI run's annotations rather than leaving it discoverable only
  # by reading this comment.
  relay-conform:
    name: RELAY conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Install relay CLI
        run: go install github.com/SoundMatt/RELAY/cmd/relay@v1.11.0
      - name: Build CLI
        run: go build -o /tmp/go-rcp ./cmd/go-rcp
      - name: relay conform --strict
        run: relay conform --strict /tmp/go-rcp
      - name: "Loud reminder: RCP interop conformance is not exercised in CI"
        if: always()
        run: |
          echo "::warning::relay interop --protocol RCP is NOT run in this workflow. \
          RELAY's only tagged RCP interop vectors still use the retired Zone/Command/Response/Status shape; \
          the v2.0.0 tag that claims to fix this does not actually point at the commit containing the fix \
          (see SoundMatt/RELAY#72). This is a real, tracked coverage gap, not a passing check — \
          see this file's relay-conform job comment for detail."
