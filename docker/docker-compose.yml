# go-RCP quickstart — a real RC Server and a controller talking real
# UDP/IP, in under two minutes.
#
# Usage:
#   docker compose -f docker/docker-compose.yml up --build
#
# The zone service runs one RC Server with a single demo endpoint. The
# controller service writes to that endpoint once a second, over the "rcp"
# bridge network's DNS (RCP_DEMO_ADDR=zone:7657).

networks:
  rcp:
    driver: bridge

services:
  zone:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: zone
    networks:
      - rcp
    restart: unless-stopped

  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: controller
    environment:
      RCP_DEMO_ADDR: "zone:7657"
    networks:
      - rcp
    restart: unless-stopped
    depends_on:
      - zone
